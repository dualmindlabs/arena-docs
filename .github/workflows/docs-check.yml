name: Docs check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate and check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: OpenAPI spec is valid JSON
        run: python3 -m json.tool api-reference/openapi.json > /dev/null
      - name: mint validate
        run: npx --yes mint@4.2.989 validate
      - name: mint broken-links
        run: npx --yes mint@4.2.989 broken-links
