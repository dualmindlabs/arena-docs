name: Docs check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MINT_VERSION: 4.2.989

# Each check step runs even if an earlier one failed (if: !cancelled()), so a
# single run lists every problem. Any failed step still fails the job.

jobs:
  validate:
    name: Validate and check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        id: node
        with:
          node-version: 24
      - name: OpenAPI spec is valid JSON
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: python3 -m json.tool api-reference/openapi.json > /dev/null
      - name: mint validate
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npx --yes "mint@${MINT_VERSION}" validate
      - name: mint openapi-check (every spec in docs.json)
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: |
          specs=$(jq -r '
            [.. | objects | select(has("openapi")) | .openapi
              | if type == "string" then .
                elif type == "array" then .[] | (if type == "string" then . else .source end)
                else .source end]
            | map(select(type == "string") | ltrimstr("/")) | unique | .[]' docs.json)
          if [ -z "$specs" ]; then
            echo "::notice::docs.json references no OpenAPI specs"
            exit 0
          fi
          failed=0
          for spec in $specs; do
            echo "::group::openapi-check $spec"
            if ! npx --yes "mint@${MINT_VERSION}" openapi-check "$spec"; then
              echo "::error file=$spec::mint openapi-check failed for $spec"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: mint broken-links (pages, anchors, snippets, redirects)
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npx --yes "mint@${MINT_VERSION}" broken-links --check-anchors --check-snippets --check-redirects
      - name: mint a11y
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npx --yes "mint@${MINT_VERSION}" a11y
